<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旧条目迁移提醒预览</title>
  <style>
    body { margin:0; padding:24px; background:#f6f7f9; color:#18202b; font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    h1 { font-size:20px; margin:0 0 12px; } p { margin:8px 0; }
    .preview { width:390px; max-width:100%; padding:16px 18px; background:#fff; border:1px solid #dce0e7; border-radius:12px; }
    .preview > p { color:#636b79; font-size:12px; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
    nav a { color:#d9153c; }
  </style>
</head>
<body>
  <h1>旧条目迁移提醒</h1>
  <nav><a href="?mode=popup&amp;lang=zh-Hans">插件弹窗</a><a href="?mode=page&amp;lang=zh-Hans">YouTube 页面提醒</a><a href="?mode=popup&amp;lang=en">English</a><a href="?mode=popup&amp;lang=ar">العربية</a><a href="?mode=popup&amp;lang=de">Deutsch</a></nav>
  <div class="preview app-shell"><main></main><p>此页使用模拟扩展环境预览迁移提醒，不会读取浏览器里的插件设置。</p></div>
  <script>window.module = { exports:{} };</script>
  <script src="notice.js"></script>
  <script>
    const previewQuery = new URLSearchParams(location.search);
    const previewMode = previewQuery.get("mode") || "popup";
    const previewLanguage = previewQuery.get("lang") || "zh-Hans";
    const previewChrome = { runtime:{id:module.exports.LEGACY_ID}, storage:{
      onChanged:{addListener(){}}, local:{
        get(keys,callback){callback({uiLanguage:previewLanguage});},
        set(values,callback){callback();}
      }
    }};
    module.exports.start({ document, chrome:previewChrome, navigator, Date,
      location:{protocol:previewMode === "popup" ? "chrome-extension:" : "https:", pathname:previewMode === "popup" ? "/popup.html" : "/"}
    });
  </script>
</body>
</html>
