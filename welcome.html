<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Title Translator</title>
  <style>
    :root { color-scheme:light; --bg:#fff; --surface:#f6f7f9; --text:#18202b; --muted:#636b79; --border:#dce0e7; --accent:#d9153c; --tint:#fff1f4; --error:#a52335; }
    * { box-sizing:border-box; } [hidden] { display:none !important; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    main { max-width:560px; margin:64px auto; padding:0 24px; }
    img { width:64px; height:64px; } h1 { font-size:28px; line-height:1.3; margin:24px 0 12px; }
    p { margin:16px 0; } #subtitle,#pinTip,#privacy { color:var(--muted); }
    .preview { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:start; gap:12px; margin:28px 0; }
    .video-card { margin:0; min-width:0; overflow-wrap:anywhere; }
    .video-card figcaption { margin-bottom:8px; font-size:13px; font-weight:600; color:var(--muted); }
    .thumbnail { aspect-ratio:16/9; background:var(--border); border-radius:8px; }
    .video-title { margin:10px 0 0; font-size:14px; font-weight:600; line-height:1.5; }
    .original-title { margin:4px 0 0; font-size:12px; line-height:1.5; color:var(--muted); }
    .preview-arrow { align-self:center; color:var(--muted); }
    .preview-arrow::before { content:"→"; } [dir="rtl"] .preview-arrow::before { content:"←"; }
    .steps { list-style:none; counter-reset:step; margin:28px 0; padding:0; }
    .steps > li { counter-increment:step; position:relative; padding:20px; padding-inline-start:62px; margin:12px 0; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
    .steps > li::before { content:counter(step); position:absolute; inset-inline-start:20px; top:20px; display:grid; place-items:center; width:28px; height:28px; border-radius:8px; background:var(--tint); color:var(--accent); font-size:14px; font-weight:600; }
    .steps h2 { margin:0 0 12px; font-size:16px; line-height:1.65; }
    .steps p { margin:8px 0 0; }
    label { display:block; font-weight:600; margin-bottom:10px; }
    select { width:100%; padding:10px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:6px; }
    #saveStatus { min-height:1.65em; margin:8px 0 0; font-size:14px; } .error { color:var(--error); }
    #localUnsupported { padding:16px; background:var(--tint); color:var(--error); border-inline-start:4px solid var(--accent); border-radius:6px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    #openYouTube { display:inline-block; color:#fff; background:var(--accent); border-radius:8px; padding:10px 20px; font-weight:600; }
    #openYouTube:hover { text-decoration:underline; }
    a:focus-visible,select:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    #privacy { font-size:13px; border-top:1px solid var(--border); padding-top:20px; }
    @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#1e2229; --surface:#292e37; --text:#f0f2f6; --muted:#b5bdca; --border:#3c4451; --accent:#ff5478; --tint:#39202a; --error:#ff9ca6; } #openYouTube { background:#d9153c; } }
    @media (max-width:600px) { main { margin:32px auto; } .preview { grid-template-columns:minmax(0,1fr); } .preview-arrow { justify-self:center; } .preview-arrow::before,[dir="rtl"] .preview-arrow::before { content:"↓"; } .steps > li { padding-inline-end:16px; } }
  </style>
  <script src="welcome-locales.js" defer></script>
  <script src="welcome.js" defer></script>
</head>
<body>
  <main>
    <img src="icon/icon128.png" alt="">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="preview">
      <figure class="video-card">
        <figcaption id="beforeLabel"></figcaption>
        <div class="thumbnail" aria-hidden="true"></div>
        <p class="video-title" id="exampleOriginal" dir="auto"></p>
      </figure>
      <span class="preview-arrow" aria-hidden="true"></span>
      <figure class="video-card">
        <figcaption id="afterLabel"></figcaption>
        <div class="thumbnail" aria-hidden="true"></div>
        <p class="video-title" id="exampleTranslated" dir="auto"></p>
        <p class="original-title" id="exampleOriginalAfter" dir="auto"></p>
      </figure>
    </div>
    <ol class="steps" role="list">
      <li>
        <h2 id="chooseLanguage"></h2>
        <label id="targetLabel" for="targetLanguage"></label>
        <select id="targetLanguage"></select>
        <p id="saveStatus" role="status" aria-live="polite"></p>
      </li>
      <li>
        <a id="openYouTube" href="https://www.youtube.com/" target="_blank" rel="noopener"></a>
        <p id="localNote" hidden></p>
        <p id="localUnsupported" role="note" hidden></p>
        <p id="aiNote"></p>
      </li>
      <li>
        <h2 id="pinTitle"></h2>
        <p id="pinTip"></p>
      </li>
    </ol>
    <p id="privacy"></p>
  </main>
</body>
</html>
